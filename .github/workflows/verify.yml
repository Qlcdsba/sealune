name: Verify Sealune

on: [push, pull_request]

permissions:
  contents: read

jobs:
  moonbit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
      - run: moon update
      - run: moon fmt --check
      - run: moon check --deny-warn --target js
      - run: moon test --deny-warn --target js
      - run: moon test --deny-warn --target wasm-gc
      - run: moon build --target js
      - name: Check the training report
        run: |
          status=0
          moon run sealune --target js -- exercise/releases.json exercise/receipts.json > report.json || status=$?
          test "$status" = 1
          diff -u exercise/expected.json report.json
      - name: Check CSV import and the item review queue
        run: |
          status=0
          moon run sealune --target js -- exercise/releases.csv exercise/receipts.json > csv-report.json || status=$?
          test "$status" = 1
          diff -u exercise/expected.json csv-report.json
          status=0
          moon run sealune --target js -- --queue exercise/releases.csv exercise/receipts.json > queue.json || status=$?
          test "$status" = 1
          jq -e '.summary.flagged_items == 4 and ([.queue[].item] == ["P-14", "P-22", "P-35", "P-48"])' queue.json
          moon run sealune --target js -- --item P-51 exercise/releases.csv exercise/receipts.json > item.json
          jq -e '.issues == [] and ([.timeline[].handoff] == ["T-06", "T-07"])' item.json
      - name: Verify clean and unreadable ledger exit codes
        run: |
          printf '[]\n' > empty-ledger.json
          moon run sealune --target js -- empty-ledger.json empty-ledger.json > clean-report.json
          jq -e '. == {matches: [], pair_findings: [], continuity_findings: []}' clean-report.json
          status=0
          moon run sealune --target js -- absent-ledger.json empty-ledger.json > input-error.json || status=$?
          test "$status" = 2
          jq -e '. == {error: "Could not read the release ledger."}' input-error.json
